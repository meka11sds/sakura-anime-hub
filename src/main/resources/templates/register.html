<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sakura - Register</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Plus Jakarta Sans', sans-serif; }</style>
</head>
<body class="bg-[#0f0711] text-pink-100 h-full flex items-center justify-center relative overflow-hidden">

<div class="absolute -top-32 -left-32 w-96 h-96 bg-pink-600/20 rounded-full blur-3xl pointer-events-none"></div>
<div class="absolute -bottom-32 -right-32 w-96 h-96 bg-purple-600/20 rounded-full blur-3xl pointer-events-none"></div>

<div class="relative z-10 w-full max-w-md p-8 bg-white/5 backdrop-blur-xl border border-white/10 rounded-3xl shadow-2xl">
    <div class="text-center mb-8">
        <h1 class="text-3xl font-bold bg-gradient-to-r from-pink-300 to-purple-300 bg-clip-text text-transparent">
            <i class="fa-solid fa-cherry-blossom mr-2 text-pink-400"></i>Create Account
        </h1>
        <p class="text-xs text-pink-300/60 mt-2 tracking-widest uppercase">Join Sakura Anime Hub</p>
    </div>

    <!-- Ошибка при совпадении логина -->
    <div th:if="${error}" class="mb-6 p-3 bg-red-500/10 border border-red-500/30 rounded-xl text-red-300 text-sm text-center" th:text="${error}">
        Ошибка регистрации
    </div>

    <form th:action="@{/register}" method="post" class="space-y-6">
        <div>
            <label class="block text-xs font-medium text-pink-200/80 mb-2 uppercase tracking-wider">Choose Username</label>
            <input type="text" name="username" required
                   class="w-full px-4 py-3 bg-white/5 border border-white/10 rounded-xl text-pink-100 placeholder-pink-300/30 focus:outline-none focus:border-pink-400/50 focus:ring-2 focus:ring-pink-400/20 transition-all">
        </div>
        <div>
            <label class="block text-xs font-medium text-pink-200/80 mb-2 uppercase tracking-wider">Choose Password</label>
            <input type="password" name="password" required
                   class="w-full px-4 py-3 bg-white/5 border border-white/10 rounded-xl text-pink-100 placeholder-pink-300/30 focus:outline-none focus:border-pink-400/50 focus:ring-2 focus:ring-pink-400/20 transition-all">
        </div>

        <button type="submit" class="w-full py-3 bg-gradient-to-r from-pink-500 to-purple-600 hover:from-pink-400 hover:to-purple-500 text-white font-medium rounded-xl shadow-lg shadow-pink-500/20 transition-all duration-300 transform hover:-translate-y-0.5">
            Register
        </button>
    </form>

    <div class="mt-8 text-center text-sm text-pink-300/60">
        Already have an account?
        <a th:href="@{/login}" class="text-pink-400 hover:text-pink-300 font-medium ml-1 transition-colors">Sign In</a>
    </div>
</div>

</body>
</html>
