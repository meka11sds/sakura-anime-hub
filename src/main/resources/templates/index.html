<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Мое Приложение</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f7f6; margin: 0; padding: 40px; }
        .container { max-width: 600px; margin: auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        h1 { color: #333; text-align: center; }
        .status { padding: 10px; background: #e2f0d9; color: #385723; border-radius: 4px; text-align: center; margin-bottom: 20px; }
    </style>
</head>
<body>
<div class="container">
    <h1>Добро пожаловать на мой сайт!</h1>
    <div class="status">✅ База данных и Бэкенд успешно работают в Docker!</div>
    <p>Здесь скоро появится список пользователей и фильмов из базы PostgreSQL.</p>
</div>
</body>
</html>
